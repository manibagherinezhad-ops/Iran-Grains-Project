name: Update exchange rates

on:
  push:
    branches: [codex/home-section-fonts-20261029]
    paths:
      - scripts/update_exchange_rates.py
      - .github/workflows/update-exchange-rates.yml
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/update_exchange_rates.py
      - name: Commit updated prices
        run: |
          git diff --quiet -- Site/index.html Site/iran-grains-standalone.html && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site/index.html Site/iran-grains-standalone.html
          git commit -m 'Update exchange-center rates from ICE'
          git push
